name: Pers Favourites QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JavaScript syntax checks
        shell: bash
        run: |
          node --check app.js
          node --check branding.js
          node --check config.js
          node --check config.example.js
          node --check sw.js
          if [ -f geo-fallback.js ]; then node --check geo-fallback.js; fi

      - name: Run latest structural QA when supplied
        shell: bash
        run: |
          LATEST_QA=$(find tests -maxdepth 1 -type f -name 'qa-*.mjs' -print 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_QA" ]; then
            echo "Running $LATEST_QA"
            node --check "$LATEST_QA"
            node "$LATEST_QA"
          else
            echo "No structural QA file supplied for this release."
          fi
