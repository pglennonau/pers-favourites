name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/places-search-worker.js'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare deployment secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }

      - name: Replace Worker code without changing bindings or settings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/pers-places-search/content" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F 'worker.js=@cloudflare/places-search-worker.js;type=application/javascript+module' \
            -o cloudflare-deploy-response.json

          jq -e '.success == true' cloudflare-deploy-response.json >/dev/null
          echo "Cloudflare Worker code deployed successfully."

      - name: Upload deployment response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker-deploy-response
          path: cloudflare-deploy-response.json
          if-no-files-found: ignore
          retention-days: 7
