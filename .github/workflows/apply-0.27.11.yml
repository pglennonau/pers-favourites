name: Apply 0.27.11 refactor

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-0.27.11.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply 0.27.11 refactor
        run: node scripts/apply-0.27.11.mjs

      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html config.js config.example.js sw.js version.json README.md .github/workflows/qa.yml tests/qa-0.27.11.mjs tests/browser-0.27.11.spec.mjs
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Refactor native cascading controls for 0.27.11"
          git push origin HEAD:main
