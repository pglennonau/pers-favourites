name: Finalize 0.27.14 release

on:
  push:
    paths:
      - '.github/workflows/patch-02714.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Finalize release files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('.')

          index=(p/'index.html').read_text()
          index=index.replace(
            '<label>State/Region<input id="placeRegion"',
            '<label><span id="placeRegionLabel">State/Region</span><input id="placeRegion"',
            1
          )
          index=index.replace(
            '<label>City/Town<input id="placeCity"',
            '<label><span id="placeCityLabel">City/Town</span><input id="placeCity"',
            1
          )
          (p/'index.html').write_text(index)

          config=(p/'config.js').read_text().replace('version: "0.27.13"','version: "0.27.14"')
          (p/'config.js').write_text(config)

          version={
            'version':'0.27.14',
            'published':'2026-09-17',
            'notes':'Fixes Add/Edit country switching on iPhone, makes the geography cascade terminology country-aware, adds Cafe - Specialty Coffee as a Place Type, and adds Coffee under Great For.'
          }
          (p/'version.json').write_text(json.dumps(version,indent=2,ensure_ascii=False)+'\n')

          sw=(p/'sw.js').read_text().replace('pers-favourites-0.27.13-shell-v1','pers-favourites-0.27.14-shell-v1')
          (p/'sw.js').write_text(sw)
          PY

          node --check app.js
          node --check config.js
          node --check sw.js
          grep -q 'id="placeRegionLabel"' index.html
          grep -q 'id="placeCityLabel"' index.html
          grep -q '0.27.14' config.js
          grep -q '0.27.14' version.json
          grep -q 'pers-favourites-0.27.14-shell-v1' sw.js

      - name: Commit final release and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-02714.yml
          git add app.js index.html config.js version.json sw.js
          git commit -m "Release 0.27.14"
          git push origin HEAD:main
